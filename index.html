<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>Eternity Auto Hub</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#17202a}*{box-sizing:border-box}
header{background:#111827;color:#fff;padding:15px;position:sticky;top:0;z-index:2}.wrap{max-width:1100px;margin:auto}
nav{display:flex;gap:7px;overflow:auto;margin-top:10px}nav button{background:#1f2937;color:#fff;border:0;padding:9px 12px;border-radius:8px;white-space:nowrap}
main{padding:18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.card{background:#fff;padding:15px;border-radius:12px;border:1px solid #e5e7eb;margin-bottom:12px}
.num{font-size:26px;font-weight:800;margin-top:5px}.muted{color:#667085;font-size:13px}button,.btn{border:0;border-radius:8px;padding:9px 12px;background:#111827;color:white;cursor:pointer;text-decoration:none;display:inline-block}.blue{background:#2563eb}.green{background:#16a34a}.red{background:#dc2626}.light{background:#e5e7eb;color:#111827}
input,select,textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:5px 0 10px}label{font-size:12px;color:#667085}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
.table{width:100%;border-collapse:collapse;background:white}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:left;font-size:13px}.tablewrap{overflow:auto;border-radius:12px}.pill{padding:4px 7px;border-radius:99px;font-size:11px;background:#eef2ff}
.login{max-width:400px;margin:12vh auto;padding:25px}.hidden{display:none}.actions{display:flex;gap:7px;flex-wrap:wrap}.danger{color:#dc2626}
@media(max-width:650px){.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head>
<body>
<div id="login" class="card login"><h1>🚗 Eternity Auto Hub</h1><p class="muted">Cloud version</p>
<label>Your name</label><input id="name" placeholder="Name">
<label>Role</label><select id="role"><option value="admin">Admin</option><option value="partner">Partner</option></select>
<button class="blue" onclick="signIn()">Enter</button></div>
<div id="app" class="hidden"><header><div class="wrap"><b>🚗 Eternity Auto Hub</b><span id="who" style="float:right"></span><nav>
<button onclick="page('home')">🏠 Home</button><button onclick="page('customers')">👥 Buyers</button><button onclick="page('vehicles')">🚗 Vehicles</button><button onclick="page('tasks')">📋 Jobs</button><button onclick="page('deals')">💰 Deals</button><button onclick="page('matches')">🎯 Matches</button><button onclick="page('notify')">🔔 Alerts</button><button id="reportBtn" onclick="page('reports')">📊 Reports</button><button onclick="logout()">Logout</button>
</nav></div></header><main class="wrap" id="content"></main></div>
<script>
const API="https://script.google.com/macros/s/AKfycbwoIspRXdDen40mz_kHlZbzhlIelORSRlPVMSDq1knM9Tpu6OGT4o2TSUyNfr4JjBU8/exec";
let me=JSON.parse(localStorage.getItem("eah_user")||"null"), data={customers:[],vehicles:[],tasks:[],deals:[]};
const $=id=>document.getElementById(id), esc=x=>String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function api(action,payload={}){if(API.startsWith("PASTE_"))throw Error("Connect the free Google Apps Script backend first.");let r=await fetch(API,{method:"POST",body:JSON.stringify({action,...payload})});return r.json()}
async function signIn(){me={name:$("name").value.trim()||"User",role:$("role").value};localStorage.setItem("eah_user",JSON.stringify(me));show()}
function logout(){localStorage.removeItem("eah_user");location.reload()}
async function load(){let r=await api("getAll");data=r.data||data;show()}
function show(){$("login").classList.add("hidden");$("app").classList.remove("hidden");$("who").textContent=(me.role==="admin"?"👑 ":"👤 ")+me.name;if(me.role!=="admin")$("reportBtn").classList.add("hidden");page("home")}
async function page(p){$("content").innerHTML="<div class='card'>Loading…</div>";try{if(!data.customers.length&&p!=="home")await load()}catch(e){$("content").innerHTML="<div class='card'><b>Backend not connected.</b><p>Open SETUP.txt in the downloaded package and connect the free backend.</p></div>";return}
if(p==="home")home();if(p==="customers")customers();if(p==="vehicles")vehicles();if(p==="tasks")tasks();if(p==="deals")deals();if(p==="matches")matches();if(p==="notify")notify();if(p==="reports")reports()}
function home(){$("content").innerHTML=`<h2>Dashboard</h2><div class=grid>${stat("👥 Buyers",data.customers.length)}${stat("🚗 Vehicles",data.vehicles.length)}${stat("📋 Open Jobs",data.tasks.filter(x=>!x.done).length)}${stat("💰 Deals",data.deals.length)}</div><div class=card><h3>Today's jobs</h3>${data.tasks.filter(x=>!x.done&&String(x.due).slice(0,10)===new Date().toISOString().slice(0,10)).map(t=>`<p>🔔 <b>${esc(t.title)}</b> — ${esc(t.assigned||"")}</p>`).join("")||"<p class=muted>No jobs today.</p>"}</div>`}
function stat(x,n){return `<div class=card><div class=muted>${x}</div><div class=num>${n}</div></div>`}
function customers(){$("content").innerHTML=`<div class=actions><button class=blue onclick="addCustomer()">+ Buyer</button></div><div class=card><div class=tablewrap><table class=table><tr><th>Name</th><th>Requirement</th><th>Budget</th><th>Follow-up</th></tr>${data.customers.map(x=>`<tr><td><b>${esc(x.name)}</b><br><a href="tel:${esc(x.phone)}">${esc(x.phone)}</a></td><td>${esc(x.brand)} ${esc(x.model)}<br>${esc(x.type)}</td><td>₹${Number(x.budget||0).toLocaleString("en-IN")}</td><td>${esc(x.followup||"-")}</td></tr>`).join("")||"<tr><td colspan=4>No buyers</td></tr>"}</table></div></div>`}
function vehicles(){$("content").innerHTML=`<button class=blue onclick="addVehicle()">+ Vehicle</button><div class=card><div class=tablewrap><table class=table><tr><th>Vehicle</th><th>Seller</th><th>Price</th><th>Status</th></tr>${data.vehicles.map(x=>`<tr><td><b>${esc(x.year)} ${esc(x.brand)} ${esc(x.model)}</b><br>${esc(x.reg)}</td><td>${esc(x.seller)}<br><a href="tel:${esc(x.phone)}">${esc(x.phone)}</a></td><td>₹${Number(x.asking||0).toLocaleString("en-IN")}</td><td>${esc(x.status)}</td></tr>`).join("")||"<tr><td colspan=4>No vehicles</td></tr>"}</table></div></div>`}
function tasks(){$("content").innerHTML=`<button class=blue onclick="addTask()">+ Job</button><div class=card><div class=tablewrap><table class=table><tr><th>Task</th><th>Assigned</th><th>Due</th><th>Status</th></tr>${data.tasks.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.assigned)}</td><td>${esc(x.due)}</td><td>${x.done?"✅ Done":`<button class=green onclick="doneTask('${x.id}')">Complete</button>`}</td></tr>`).join("")||"<tr><td colspan=4>No jobs</td></tr>"}</table></div></div>`}
function deals(){$("content").innerHTML=`<button class=blue onclick="addDeal()">+ Deal</button><div class=card><div class=tablewrap><table class=table><tr><th>Vehicle</th><th>Buyer</th><th>Seller</th><th>Customer</th><th>Margin</th></tr>${data.deals.map(x=>`<tr><td>${esc(x.vehicle)}</td><td>${esc(x.buyer)}</td><td>₹${Number(x.sellerPrice||0).toLocaleString("en-IN")}</td><td>₹${Number(x.customerPrice||0).toLocaleString("en-IN")}</td><td><b>₹${Number(x.margin||0).toLocaleString("en-IN")}</b></td></tr>`).join("")||"<tr><td colspan=5>No deals</td></tr>"}</table></div></div>`}
function matches(){let out=[];data.customers.forEach(c=>data.vehicles.forEach(v=>{let s=0;if(c.brand&&v.brand?.toLowerCase().includes(c.brand.toLowerCase()))s+=35;if(c.model&&v.model?.toLowerCase().includes(c.model.toLowerCase()))s+=35;if(c.budget&&+v.asking<=+c.budget)s+=15;if(c.minYear&&+v.year>=+c.minYear)s+=10;if(c.maxKm&&+v.km<=+c.maxKm)s+=5;if(s>=50)out.push([s,c,v])}));$("content").innerHTML=`<h2>Buyer ↔ Vehicle Matches</h2><div class=grid>${out.sort((a,b)=>b[0]-a[0]).map(m=>`<div class=card><b>🎯 ${m[0]}% match</b><p>${esc(m[1].name)} wants ${esc(m[1].brand)} ${esc(m[1].model)}</p><p><b>${esc(m[2].year)} ${esc(m[2].brand)} ${esc(m[2].model)}</b><br>₹${Number(m[2].asking||0).toLocaleString("en-IN")}</p><a class=btn blue href="tel:${esc(m[1].phone)}">Call buyer</a></div>`).join("")||"<div class=card>No matches yet.</div>"}</div>`}
function notify(){let now=Date.now();let a=data.tasks.filter(x=>!x.done&&new Date(x.due).getTime()<=now+86400000);$("content").innerHTML=`<h2>🔔 Alerts</h2>${a.map(x=>`<div class=card>🔔 <b>${esc(x.title)}</b><br><span class=muted>${esc(x.due)} · ${esc(x.assigned)}</span></div>`).join("")||"<div class=card>No alerts.</div>"}`}
function reports(){if(me.role!=="admin")return;$("content").innerHTML=`<h2>Reports</h2>${stat("Total margin","₹"+data.deals.reduce((a,x)=>a+ +x.margin,0).toLocaleString("en-IN"))}<div class=card>${Object.entries(data.deals.reduce((a,x)=>(a[x.partner]=(a[x.partner]||0)+ +x.margin,a),{})).map(([k,v])=>`<p><b>${esc(k)}</b>: ₹${v.toLocaleString("en-IN")}</p>`).join("")||"No deals."}</div>`}
function form(title,fields,cb){let h=`<div class=card><h2>${title}</h2><div class=formgrid>`;fields.forEach(f=>h+=`<div class="${f.full?'full':''}"><label>${f.l}</label><input id="f_${f.n}" type="${f.t||'text'}" value="${esc(f.v||"")} placeholder="${esc(f.p||"")}"></div>`);h+=`</div><div class=actions><button class=blue onclick="${cb}">Save</button><button class=light onclick="page('home')">Cancel</button></div></div>`;$("content").innerHTML=h}
function val(n){return $("f_"+n).value}
async function addCustomer(){form("Add Buyer",[{n:"name",l:"Name",t:"text"},{n:"phone",l:"Phone"},{n:"type",l:"Car / Bike",v:"Car"},{n:"brand",l:"Brand"},{n:"model",l:"Model"},{n:"budget",l:"Budget",t:"number"},{n:"minYear",l:"Min Year",t:"number"},{n:"maxYear",l:"Max Year",t:"number"},{n:"maxKm",l:"Max KM",t:"number"},{n:"followup",l:"Follow-up",t:"date"},{n:"location",l:"Location"},{n:"notes",l:"Notes",full:true}], "saveCustomer()")}
async function saveCustomer(){await api("addCustomer",{record:{name:val("name"),phone:val("phone"),type:val("type"),brand:val("brand"),model:val("model"),budget:val("budget"),minYear:val("minYear"),maxYear:val("maxYear"),maxKm:val("maxKm"),followup:val("followup"),location:val("location"),notes:val("notes") ,createdBy:me.name}});await load();page("customers")}
async function addVehicle(){form("Add Vehicle",[{n:"seller",l:"Seller"},{n:"phone",l:"Phone"},{n:"reg",l:"Registration"},{n:"year",l:"Year",t:"number"},{n:"brand",l:"Brand"},{n:"model",l:"Model"},{n:"km",l:"KM",t:"number"},{n:"asking",l:"Asking Price",t:"number"},{n:"lowest",l:"Lowest Price",t:"number"},{n:"status",l:"Status",v:"New"},{n:"notes",l:"Notes",full:true}],"saveVehicle()")}
async function saveVehicle(){await api("addVehicle",{record:{seller:val("seller"),phone:val("phone"),reg:val("reg"),year:val("year"),brand:val("brand"),model:val("model"),km:val("km"),asking:val("asking"),lowest:val("lowest"),status:val("status"),notes:val("notes"),createdBy:me.name}});await load();page("vehicles")}
async function addTask(){form("Assign Job",[{n:"title",l:"Job"},{n:"assigned",l:"Partner"},{n:"due",l:"Due",t:"datetime-local"},{n:"priority",l:"Priority",v:"Normal"},{n:"notes",l:"Notes",full:true}],"saveTask()")}
async function saveTask(){await api("addTask",{record:{title:val("title"),assigned:val("assigned"),due:val("due"),priority:val("priority"),notes:val("notes"),done:false,createdBy:me.name}});await load();page("tasks")}
async function doneTask(id){await api("doneTask",{id,by:me.name});await load();page("tasks")}
async function addDeal(){form("Close Deal",[{n:"vehicle",l:"Vehicle"},{n:"buyer",l:"Buyer"},{n:"sellerPrice",l:"Seller Price",t:"number"},{n:"customerPrice",l:"Customer Price",t:"number"},{n:"partner",l:"Partner",v:me.name}], "saveDeal()")}
async function saveDeal(){let s=+val("sellerPrice"),c=+val("customerPrice");await api("addDeal",{record:{vehicle:val("vehicle"),buyer:val("buyer"),sellerPrice:s,customerPrice:c,margin:c-s,partner:val("partner"),date:new Date().toISOString().slice(0,10)}});await load();page("deals")}
if(me) {load().then(show).catch(show)} else {}
</script></body></html>
